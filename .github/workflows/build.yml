name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            bin: voxel
            name: voxel-linux
          - os: windows-latest
            bin: voxel.exe
            name: voxel-windows
          - os: macos-latest
            bin: voxel
            name: voxel-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: target/release/${{ matrix.bin }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - run: |
          mv voxel-windows/voxel.exe voxel-windows.exe
          mv voxel-linux/voxel voxel-linux
          mv voxel-macos/voxel voxel-macos
          chmod +x voxel-linux voxel-macos
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            voxel-windows.exe
            voxel-linux
            voxel-macos
