[package]
name = "voxel"
version = "0.1.0"
edition = "2021"
description = "Biblioteca de assets voxel: aprovação, montagem de cenas e exportação"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "2.12", features = ["json", "native-certs", "proxy-from-env"] }
base64 = "0.22"

[profile.release]
strip = true
